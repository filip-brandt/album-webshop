<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍩</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FED25D | JS 1</title>
</head>

<body>
  <header>header</header>

  <main>

    <h1>Order Queen Studio Albums!</h1>

    <section class="cart">
      <h2>Cart</h2>
      <p class="cart-total" id="cartTotal">0 kr</p>
      <div id="cart">Cart is empty.</div>
    </section>

    <div>
      Filter:
      <button id="filterBtnShowAll">Show all</button>
      <button id="filterBtn70s">70's</button>
      <button id="filterBtn80s">80's</button>
      <button id="filterBtn90s">90's</button>
    </div>

    <div>
      Sort:
      <button id="sortBtnName">Name (A-Z)</button>
      <button id="sortBtnPrice">Price</button>
      <button id="sortBtnRating">Rating</button>
    </div>

    <section class="products-list" id="products"></section>

    <section class="customer-info">
      <h2>Your details</h2>
      <form>
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname" required />

        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname" required />

        <label for="street">Street name:</label>
        <input type="text" id="street" name="street" required />

        <label for="postcode">Postal code:</label>
        <input type="text" id="postcode" name="postcode" required />

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required />

        <label for="port">Port code:</label>
        <input type="text" id="port" name="port" />

        <label for="phone">Phone number:</label>
        <input type="tel" id="phone" name="phone" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <button type="submit">Place Order</button>
      </form>
    </section>

  </main>

  <footer>footer</footer>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
